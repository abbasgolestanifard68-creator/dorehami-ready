name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The zip has no gradle-wrapper.jar / gradlew; take them from a throwaway template project.
      - name: Add Gradle wrapper files
        run: |
          flutter create --platforms=android --project-name tmpl "$RUNNER_TEMP/tmpl"
          cp "$RUNNER_TEMP/tmpl/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          cp "$RUNNER_TEMP/tmpl/android/gradlew" "$RUNNER_TEMP/tmpl/android/gradlew.bat" android/
          chmod +x android/gradlew

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
